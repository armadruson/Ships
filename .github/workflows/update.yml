name: Refresh data and deploy

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC; new lists usually land in Jan/Feb
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  actions: write     # keep-alive: re-enable this workflow's schedule
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch lists and rebuild
        if: github.event_name != 'push'
        run: |
          python scripts/fetch.py
          python scripts/build.py

      - name: Commit if the data changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data docs/data)" ]; then
            git config user.name "last-voyage-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data docs/data
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new or corrected lists."
          fi

      # GitHub disables schedules in public repos after 60 days without commits.
      # Re-enabling via the API resets that clock without adding commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
